# Copied to <bundle>/.streamlit/config.toml: Streamlit reads it from the directory you run `streamlit run` in.
# Light and dark are both defined, so the app's Settings menu offers System / Light / Dark.
[browser]
gatherUsageStats = false

[server]
maxUploadSize = 50

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif"
headingFont = "Playfair Display:https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap, Noto Serif TC, PMingLiU, serif"
baseFontSize = 16
baseRadius = "0.9rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#8C5A3C"
backgroundColor = "#F7F3EC"
secondaryBackgroundColor = "#EFE8DC"
textColor = "#2B2A28"
borderColor = "#E3D9CA"

[theme.dark]
primaryColor = "#D9A36A"
backgroundColor = "#191816"
secondaryBackgroundColor = "#24221F"
textColor = "#EEE8DE"
borderColor = "#3A3631"

[client]
toolbarMode = "viewer"
